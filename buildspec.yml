version: 0.2

env:
  variables:
    GITHUB_REPO: "nabinlamichhane/TestBuild1"
  secrets-manager:
    GITHUB_TOKEN: github-access:Token

phases:
  pre_build:
    commands:
      - echo "Starting GitHub Actions Runner setup at $(date)"
      - echo "Getting runner registration token..."
      - RUNNER_TOKEN=$(curl -X POST -H "Authorization:token ${GITHUB_TOKEN}" -H "Accept:application/vnd.github.v3+json" https://api.github.com/repos/${GITHUB_REPO}/actions/runners/registration-token | jq -r .token)
      - export RUNNER_VERSION=2.311.0
      - export RUNNER_ARCH=linux-x64
      
  build:
    commands:
      - echo "Downloading GitHub Actions Runner..."
      - mkdir -p actions-runner && cd actions-runner
      - curl -o actions-runner-${RUNNER_ARCH}-${RUNNER_VERSION}.tar.gz -L https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-${RUNNER_ARCH}-${RUNNER_VERSION}.tar.gz
      - tar xzf ./actions-runner-${RUNNER_ARCH}-${RUNNER_VERSION}.tar.gz
      
      - echo "Configuring runner..."
      - export RUNNER_ALLOW_RUNASROOT=1
      - ./config.sh --url https://github.com/${GITHUB_REPO} --token ${RUNNER_TOKEN} --name codebuild-runner-${CODEBUILD_BUILD_NUMBER} --work _work --labels codebuild,aws --ephemeral --disableupdate
      
      - echo "Starting runner..."
      - ./run.sh || echo "Runner completed or timed out"
      
  post_build:
    commands:
      - echo "Cleaning up runner at $(date)"
